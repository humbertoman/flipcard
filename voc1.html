
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voc1</title>
<style>
/* Adicionado padding ao body para criar espaçamento nas bordas da página */
body {
    padding: 20px;
    box-sizing: border-box;
    font-family: sans-serif;
}
.card-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));width:100%;}
.flip-card{width:100%;aspect-ratio:16/9;perspective:1000px;cursor:pointer;}
.flip-card-inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d;}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
.face{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:10px;overflow:hidden;}
.front{display:flex;align-items:center;justify-content:center;background:#005792;color:#fff;font:600 1.4rem/1;padding:5px;text-align:center;}
.back{transform:rotateY(180deg);}
.back video,.back img,.back iframe{width:100%;height:100%;object-fit:cover;border:0;}
.back iframe{pointer-events:none;}
</style>
</head>
<body>
    <section class="card-grid">
        
<div class="flip-card" tabindex="0" onclick="handleCardFlip(this)">
  <div class="flip-card-inner">
    <div class="face front">Bonito</div>
    <div class="face back"><iframe src="https://www.youtube.com/embed/7sioWt9pkUY?autoplay=1&mute=1&controls=0&loop=1&playlist=7sioWt9pkUY" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
  </div>
</div>
    </section>

    <!-- Elemento de áudio para o som do flip -->
    <audio id="flipAudio" src="sounds/flip_sound.wav" preload="auto"></audio>

    <script>
        // Função que vira o card e toca o som
        function handleCardFlip(cardElement) {
            // Vira o card adicionando/removendo a classe 'flipped'
            cardElement.classList.toggle('flipped');

            // Pega o elemento de áudio
            const flipSound = document.getElementById('flipAudio');

            // Toca o som
            if (flipSound) {
                flipSound.currentTime = 0; // Reinicia o som caso seja clicado rapidamente
                flipSound.play().catch(e => console.error("Erro ao tocar o som:", e));
            }
        }
    </script>
</body>
</html>
